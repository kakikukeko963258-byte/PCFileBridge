name: Build PC File Bridge

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-server:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish Windows single-file app
        run: dotnet publish windows/PCFileBridge.Windows/PCFileBridge.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/windows
      - uses: actions/upload-artifact@v4
        with:
          name: PCFileBridge-Windows-x64
          path: artifacts/windows/PCFileBridge.Windows.exe

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --spec project.yml
      - name: Build app and File Provider extension for iOS Simulator
        working-directory: ios
        run: xcodebuild -project PCFileBridge.xcodeproj -scheme PCFileBridge -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath ../artifacts/ios CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        with:
          name: PCFileBridge-iOS-Simulator-Build
          path: artifacts/ios/Build/Products/Debug-iphonesimulator/PCFileBridge.app
      - name: Build unsigned iPhone app and File Provider extension
        working-directory: ios
        run: xcodebuild -project PCFileBridge.xcodeproj -scheme PCFileBridge -configuration Release -destination 'generic/platform=iOS' -derivedDataPath ../artifacts/ios-device CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA for AltStore
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="artifacts/ios-device/Build/Products/Release-iphoneos/PCFileBridge.app"
          test -d "$APP_PATH"
          mkdir -p artifacts/ipa/Payload
          /usr/bin/ditto "$APP_PATH" artifacts/ipa/Payload/PCFileBridge.app
          (cd artifacts/ipa && /usr/bin/zip -qry ../PCFileBridge-AltStore-Unsigned.ipa Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: PCFileBridge-AltStore-Unsigned-IPA
          path: artifacts/PCFileBridge-AltStore-Unsigned.ipa
